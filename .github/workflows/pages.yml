name: Deploy frontend to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['frontend/**', 'shared/**', 'package*.json', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require production API URL
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: node -e "const u=new URL(process.env.VITE_API_URL); if(u.protocol!=='https:') throw Error('Set VITE_API_URL to the HTTPS Worker URL');"
      - run: npm run typecheck
      - run: npm test
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm run build -w frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - uses: actions/deploy-pages@v4
        id: deployment
